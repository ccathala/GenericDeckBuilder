coverage:
  status:
    project:
      default:
        target: 48%
        threshold: 5%
        if_not_found: success
        if_ci_failed: success
    patch:
      default:
        target: 48%
        threshold: 5%
        if_not_found: success

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true

ignore:
  - "backend/src/main/java/com/suri/generic/deck/builder/config/**"
  - "backend/src/main/java/com/suri/generic/deck/builder/dto/**"
  - "backend/src/main/java/com/suri/generic/deck/builder/model/**"
  - "**/*Application.java"
  - "backend/src/test/**"
  - "backend/target/**"

flags:
  backend:
    paths:
      - backend/src/main/java/
    carryforward: true
