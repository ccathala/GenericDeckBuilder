# Configuration pour l'environnement de production
server:
  port: ${PORT:8080}
  # Context-path retiré pour servir React à la racine
  error:
    include-stacktrace: never
    include-message: always

spring:
  # Configuration base de données production (gérée par DatabaseConfig.java)
  # L'URL DATABASE_URL de Railway est automatiquement convertie au format JDBC
  datasource:
    # Les propriétés sont configurées programmatiquement dans DatabaseConfig
    driver-class-name: org.postgresql.Driver

  # JPA/Hibernate pour production
  jpa:
    hibernate:
      ddl-auto: validate # Permet la création des tables au premier déploiement
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        use_sql_comments: false
        jdbc:
          batch_size: 20
        cache:
          use_second_level_cache: false

  # Flyway désactivé pour le premier déploiement (pas de migrations prêtes)
  flyway:
    enabled: false

  # Configuration du cache
  cache:
    type: simple

# Configuration JWT personnalisée
app:
  jwt:
    secret: ${JWT_SECRET:defaultSecretKeyForDevelopmentOnlyNotForProduction}
    expiration: 86400000 # 24 heures

# Configuration des logs (production optimisée)
logging:
  level:
    "[com.suri.generic.deck.builder]": INFO
    "[org.springframework.security]": WARN
    "[org.springframework.web.servlet]": WARN
    root: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# Actuator pour le monitoring
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      show-components: always
  info:
    env:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
