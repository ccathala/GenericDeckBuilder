# Configuration pour l'environnement de production
server:
  port: ${PORT:8080}
  servlet:
    context-path: /api
  error:
    include-stacktrace: never
    include-message: always

spring:
  # Configuration base de données production
  datasource:
    url: ${DATABASE_URL}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
      leak-detection-threshold: 60000

  # JPA/Hibernate pour production
  jpa:
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        use_sql_comments: false
        jdbc:
          batch_size: 20
        cache:
          use_second_level_cache: false

  # Flyway pour les migrations en production
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true

  # Configuration du cache
  cache:
    type: simple

# Configuration JWT personnalisée
app:
  jwt:
    secret: ${JWT_SECRET:defaultSecretKeyForDevelopmentOnlyNotForProduction}
    expiration: 86400000 # 24 heures

# Configuration des logs
logging:
  level:
    "[com.suri.generic.deck.builder]": INFO
    "[org.springframework.security]": WARN
    "[org.hibernate.SQL]": WARN
    "[org.springframework.web]": WARN
    "[org.springframework.boot.autoconfigure.security]": INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# Actuator pour le monitoring
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      show-components: always
  info:
    env:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
